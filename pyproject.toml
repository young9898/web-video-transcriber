[project]
name = "web-video-transcriber"
version = "0.1.0"
description = "Transcribe web videos using site captions when they exist and local Whisper when they don't."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Michael Young" }]
keywords = ["transcription", "whisper", "yt-dlp", "captions", "subtitles"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "yt-dlp",
    "openai-whisper",
]

[project.urls]
Homepage = "https://github.com/young9898/web-video-transcriber"

[project.scripts]
transcribe = "transcriber:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["transcriber"]
